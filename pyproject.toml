[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-mobile-support-copilot"
version = "3.0.0"
description = "Support ticket triage for Grand Mobile: classification, RAG over game rules, drafts in 6 languages"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26,<3",
  "scipy>=1.11,<2",
  "scikit-learn>=1.5,<2",
]

[project.optional-dependencies]
llm = ["httpx>=0.28,<1"]
dev = ["pytest>=8,<10"]

[project.scripts]
copilot = "support_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
support_copilot = ["v3/admin_ui.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
