[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "grand-mobile-support-copilot"
version = "0.1.0"
description = "Local, evidence-grounded Grand Mobile support triage baseline"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn>=0.34,<1",
  "pydantic>=2.10,<3",
  "numpy>=1.26,<3",
  "transformers>=5.16.1,<6",
  "accelerate>=1.6,<2",
  "huggingface-hub>=1,<3",
  "safetensors>=0.5,<1",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]
native = ["sentencepiece>=0.2,<0.3", "protobuf>=4.21,<5"]
inference = ["soup-cli==0.77.0", "peft>=0.20,<1", "bitsandbytes>=0.50,<1"]
train = ["soup-cli==0.77.0", "peft>=0.20,<1", "bitsandbytes>=0.50,<1", "trl>=0.29,<1", "datasets>=3,<6"]

[project.scripts]
copilot = "support_copilot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
