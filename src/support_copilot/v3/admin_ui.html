<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Очередь поддержки</title>
<style>
:root{--bg:#f6f5f2;--panel:#fff;--ink:#1d1d1b;--mute:#6b6a65;--line:#e4e2dc;--accent:#2f5d50;--p0:#b3261e;--p1:#c26a00;--p2:#3b6ea5;--p3:#7a7a7a;--ok:#2e7d32}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe7;--mute:#9c9a93;--line:#33322f;--accent:#7fb8a4}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--panel);flex-wrap:wrap}
header h1{font-size:16px;margin:0 12px 0 0;font-weight:650}
button,select{font:inherit;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:6px;padding:6px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}button:disabled{opacity:.5;cursor:default}
.stats{color:var(--mute);font-size:13px;margin-left:auto}
main{display:grid;grid-template-columns:minmax(260px,380px) 1fr;height:calc(100vh - 57px)}
@media (max-width:760px){main{grid-template-columns:1fr;height:auto}#list{max-height:45vh}}
#list{overflow:auto;border-right:1px solid var(--line)}
.item{padding:10px 14px;border-bottom:1px solid var(--line);cursor:pointer}.item:hover,.item.sel{background:var(--panel)}
.item .t{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;color:var(--ink)}
.row{display:flex;gap:6px;align-items:center;flex-wrap:wrap;margin-bottom:4px;font-size:12px;color:var(--mute)}
.badge{font-size:11px;font-weight:650;padding:1px 6px;border-radius:4px;color:#fff}.p0{background:var(--p0)}.p1{background:var(--p1)}.p2{background:var(--p2)}.p3{background:var(--p3)}
.tag{border:1px solid var(--line);border-radius:4px;padding:0 5px}.human{color:var(--p0)}.auto{color:var(--ok)}
.st-sent,.st-edited{color:var(--ok)}.st-escalated{color:var(--p1)}
#detail{overflow:auto;padding:18px 22px}#detail h2{font-size:15px;margin:18px 0 6px}
.msg{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:10px 12px;margin-bottom:8px;white-space:pre-wrap}
.msg b{display:block;font-size:12px;color:var(--mute);font-weight:600;margin-bottom:2px}
textarea{width:100%;min-height:150px;font:inherit;padding:10px;border-radius:8px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.actions{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
dl{display:grid;grid-template-columns:max-content 1fr;gap:4px 14px;margin:0}dt{color:var(--mute)}dd{margin:0}
details{margin-top:14px;color:var(--mute);font-size:12px}details li{word-break:break-all}
.empty{color:var(--mute);padding:40px;text-align:center}
</style>
</head>
<body>
<header>
  <h1>Support Copilot · очередь</h1>
  <select id="filter"><option value="all">Все</option><option value="human">Нужен человек</option><option value="auto">Авто</option><option value="new">Не разобрано</option></select>
  <button id="demo">Загрузить 40 тикетов из valid</button>
  <span class="stats" id="stats"></span>
</header>
<main>
  <div id="list"><div class="empty">Очередь пуста. Отправьте POST /triage или загрузите тикеты из valid.</div></div>
  <section id="detail"><div class="empty">Выберите обращение слева</div></section>
</main>
<script>
const $=s=>document.querySelector(s);let items=[],sel=null;
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const CATS=["complaint.insult","complaint.cheat","complaint.dm","complaint.scam","complaint.rmt_ads","complaint.admin","complaint.other","complaint.invalid","report.question","report.help","report.complaint","report.account","report.payment","report.offtopic"];
async function load(){items=await (await fetch("/api/queue")).json();render();const r=await (await fetch("/ready")).json();
 const h=items.filter(i=>i.result.needs_human).length;$("#stats").textContent=`в очереди ${items.length} · нужен человек ${items.length?Math.round(100*h/items.length):0}% · p95 ${r.p95_ms??"—"} мс`;}
function visible(){const f=$("#filter").value;return items.filter(i=>f==="all"||(f==="human"&&i.result.needs_human)||(f==="auto"&&!i.result.needs_human)||(f==="new"&&i.status==="new"));}
function render(){const v=visible();$("#list").innerHTML=v.length?v.map(i=>{const r=i.result,t=i.request.messages.filter(m=>m.role==="player").map(m=>m.text).join(" ");
 return `<div class="item ${sel===i.id?"sel":""}" data-id="${i.id}"><div class="row"><span class="badge ${r.priority}">${r.priority}</span><span class="tag">${r.category}</span><span class="tag">${r.lang}</span>
 <span class="${r.needs_human?"human":"auto"}">${r.needs_human?"человек":"авто"}</span>${r.is_spam_or_duplicate?'<span class="tag">дубль/спам</span>':""}<span class="st-${i.status}">${i.status!=="new"?i.status:""}</span></div><div class="t">${esc(t)}</div></div>`}).join(""):'<div class="empty">Нет обращений</div>';
 document.querySelectorAll(".item").forEach(e=>e.onclick=()=>{sel=e.dataset.id;render();detail();});}
function detail(){const i=items.find(x=>x.id===sel);if(!i)return;const r=i.result,x=r.extracted;
 $("#detail").innerHTML=`<div class="row"><span class="badge ${r.priority}">${r.priority}</span><span class="tag">${i.request.kind}</span><span class="tag">язык: ${r.lang}</span><span>уверенность ${r.confidence}</span></div>
 <h2>Обращение</h2>${i.request.messages.filter(m=>m.role!=="admin").map(m=>`<div class="msg"><b>${m.role==="player"?"Игрок":"Обвиняемый"}</b>${esc(m.text)}</div>`).join("")}
 <h2>Факты</h2><dl><dt>Категория</dt><dd><select id="cat">${CATS.map(c=>`<option ${c===r.category?"selected":""}>${c}</option>`).join("")}</select></dd>
 <dt>Ник</dt><dd>${esc(x.nickname)||"—"}</dd><dt>Пункты от игрока</dt><dd>${x.rule_refs.join(", ")||"—"}</dd><dt>Доказательства</dt><dd>${x.has_evidence?"есть":"нет"}</dd><dt>Сервер</dt><dd>${esc(x.server)||"—"}</dd>
 <dt>Цитаты черновика</dt><dd>${r.draft_reply.cited.join(", ")||"—"}</dd><dt>Нужен человек</dt><dd>${r.needs_human?"да":"нет"}</dd></dl>
 <h2>Черновик ответа</h2><textarea id="draft">${esc(r.draft_reply.text)}</textarea>
 <div class="actions"><button class="primary" data-a="send">Отправить</button><button data-a="edit">Сохранить правку и отправить</button><button data-a="escalate">Эскалировать</button></div>
 <details><summary>Почему так решено (${r.reasons.length})</summary><ul>${r.reasons.map(s=>`<li>${esc(s)}</li>`).join("")}</ul></details>`;
 document.querySelectorAll(".actions button").forEach(b=>b.onclick=()=>act(b.dataset.a));}
async function act(a){const body={id:sel,action:a,text:$("#draft").value};const c=$("#cat").value;const i=items.find(x=>x.id===sel);if(c!==i.result.category)body.category=c;
 const res=await fetch("/api/feedback",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(body)});if(res.ok){await load();const n=visible().find(x=>x.status==="new");if(n){sel=n.id;render();}detail();}}
$("#demo").onclick=async()=>{$("#demo").disabled=true;await fetch("/api/queue/demo?n=40",{method:"POST"});$("#demo").disabled=false;load();};
$("#filter").onchange=render;load();setInterval(load,15000);
</script>
</body>
</html>
