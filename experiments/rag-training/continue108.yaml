# Local Soup0.77 continuation of old LoRA weights; fresh optimizer, not checkpoint resume.
base: .private/models/qwen3-8b
task: sft
backend: transformers
modality: text
data:
  train: .private/rag-training-v2/prepared-reviewed/train108.jsonl
  format: chatml
  val_split: 0.0
  max_length: 512
  train_on_responses_only: true
training:
  epochs: 1
  lr: 0.00005
  batch_size: 1
  gradient_accumulation_steps: 1
  quantization: 4bit
  stream_layers: true
  stream_source: disk
  stream_buffers: 2
  optimizer: adamw_torch
  packing: false
  logging_steps: 1
  save_steps: 108
  seed: 42
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, v_proj]
output: .private/soup-runs/qwen3-8b-rag-v2
