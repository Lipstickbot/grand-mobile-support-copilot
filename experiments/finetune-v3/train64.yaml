# Fresh adapter on exact-source RU silver targets; not a production model.
base: .private/models/qwen3-8b
task: sft
backend: transformers
modality: text
data:
  train: .private/finetune-v3/prepared/train.jsonl
  format: chatml
  val_split: 0.0
  max_length: 768
  train_on_responses_only: true
training:
  epochs: 1
  lr: 0.00002
  batch_size: 1
  gradient_accumulation_steps: 1
  quantization: 4bit
  stream_layers: true
  stream_source: disk
  stream_buffers: 2
  optimizer: adamw_torch
  packing: false
  logging_steps: 1
  save_steps: 64
  seed: 42
  lora:
    r: 8
    alpha: 16
    dropout: 0.0
    target_modules: [q_proj, v_proj]
output: .private/soup-runs/qwen3-8b-grounded-v3
